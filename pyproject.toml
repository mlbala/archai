[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archai"
version = "2.0.0"
description = "Enterprise AI solutions architecture CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "filelock>=3.16,<4",
  "google-genai>=1.0,<2",
  "jinja2>=3.1,<4",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
render = ["cairosvg>=2.7,<3", "pillow>=11,<14", "reportlab>=4.2,<5"]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
arch = "archai.cli:app"
archai = "archai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/archai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

